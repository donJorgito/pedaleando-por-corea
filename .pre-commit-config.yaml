# Guardarraíl local antes del push. Forma deliberada: SOLO `repo: local`,
# nunca `repo: https://github.com/...` — cada hook invoca una herramienta ya
# instalada en la máquina, de modo que el commit no dependa de descargar
# nada en ese momento.
#
# Las herramientas se instalan desde PyPI público con la versión pineada:
#
#   pip install --user pre-commit==4.0.1 pre-commit-hooks==5.0.0
#   brew install gitleaks   # o descarga pineada de la release
#
# Instalar el hook:  pre-commit install
# Pasada completa:   pre-commit run --all-files   (obligatorio antes de cada push)

repos:
  - repo: local
    hooks:
      - id: end-of-file-fixer
        name: end-of-file-fixer
        entry: end-of-file-fixer
        language: system
        types: [text]
      - id: trailing-whitespace
        name: trailing-whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]
      - id: check-yaml
        name: check-yaml
        entry: check-yaml
        language: system
        types: [yaml]
      - id: check-added-large-files
        name: check-added-large-files
        entry: check-added-large-files
        language: system
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
        name: check-merge-conflict
        entry: check-merge-conflict
        language: system
      - id: gitleaks
        name: gitleaks (escaneo de secretos)
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false
      - id: tests-requisitos
        name: tests de requisitos (uno por RQ)
        entry: tests/run-all.sh
        language: system
        pass_filenames: false
