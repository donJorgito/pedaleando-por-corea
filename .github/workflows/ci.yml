# Gates de calidad. La numeración no implica orden: corren en paralelo.
# Todas las actions van pineadas al SHA de 40 caracteres, con el semver en
# comentario (convención para Actions, cuyo ref es git y no un digest).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scanning:
    name: Secret Scanning (gate 1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linting:
    name: Linting (gate 3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  tests:
    name: Tests de requisitos (gate 4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ejecutar la batería de tests
        run: tests/run-all.sh

  # Gate 5: construir el sitio. Sin esto, un error de Liquid o de SCSS solo
  # aparece al desplegar, porque pages.yml únicamente corre en main.
  build:
    name: Construcción del sitio (gate 5)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site
      - name: Comprobar que las páginas clave existen
        run: |
          for f in _site/index.html _site/sitemap.xml _site/feed.xml; do
            [ -s "$f" ] || { echo "falta o está vacío: $f"; exit 1; }
          done

      # Red de seguridad sobre el HTML ya generado: en un sitio de proyecto
      # todo enlace interno tiene que empezar por el baseurl. Sin esto, un
      # {% post_url %} sin {{ site.baseurl }} se publica roto y ningún gate
      # se entera (nos pasó con seis enlaces).
      - name: Comprobar que no hay enlaces internos sin baseurl
        run: |
          base=$(grep -E '^baseurl:' _config.yml | sed -E 's/.*"(.*)".*/\1/')
          [ -n "$base" ] || { echo "no se pudo leer baseurl de _config.yml"; exit 1; }
          malos=$(grep -rhoE 'href="/[^"]*"' _site --include='*.html' \
                  | sort -u | grep -v "^href=\"$base" || true)
          if [ -n "$malos" ]; then
            echo "Enlaces internos sin el baseurl '$base':"
            printf '%s\n' "$malos"
            exit 1
          fi
          echo "todos los enlaces internos llevan el baseurl"
